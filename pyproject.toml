[project]
name = "shakespeare-transformer"
version = "0.1.0"
description = "Shakespeare-style text generation using a Transformer built with PyTorch and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
